<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The Spell of Quiet</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header id="site-header">
            <h1>The Spell of Quiet</h1>
            <p class="tagline">A cozy home for fiber projects, books, and sim legacies</p>
            <div id="toolbar" class="tools">
                <button id="new-page">+ New Page</button>
            </div>
            <button id="toggle-tools">Hide Tools</button>
        </header>

        <main id="home-view">
            <div id="page-cards"></div>
        </main>

        <main id="page-view" hidden>
            <button id="back-home" class="tools"> <- All Pages</button>
            <h2 id="page-title"></h2>
            <p id="page-type"></p>
            <div id="palette-picker" class="tools">
                <h3>Palette</h3>
                <div id="preset-palettes"></div>
                <div id="custom-colors"></div>
            </div>
            <div id="editor-toolbar" class="tools">
                <button data-cmd="bold"><b>B</b></button>
                <button data-cmd="italic"><i>I</i></button>
                <button data-cmd="underline"><u>U</u></button>
                <button data-cmd="formatBlock" data-value="h2">H</button>
            </div>
            <div id="writing-area" contenteditable="true"></div>
        </main>

        <script>
            const toggleBtn = document.getElementById('toggle-tools');
            toggleBtn.addEventListener('click', function() {
                const hidden = document.body.classList.toggle('hiding-tools');
                toggleBtn.textContent = hidden ? 'Show Tools' : 'Hide Tools'
            });
           const typeLabels = { fiber: 'Fiber Project', book: 'Book', legacy: 'Sim Legacy' };

        const defaultPalette = { bg: '#1a1a2e', card: '#2d1b2e', accent: '#c9a227', text: '#e8e0d0', muted: '#a89a7a' };

        function seedPages() {
            return [
                { id: 'wisp', title: 'Will-O-The-Wisp Socks', type: 'fiber',
                palette: { bg: '#0f1b2d', card: '#1c2f4a', accent: '#7fd4c1', text: '#e8f0e8', muted: '#7a9a94' },
                content: '<p>Two socks, one ghostly flame of a colorway.</p>' },
                { id: 'silk', title: 'Silk Shadows', type: 'book',
                palette: { bg: '#1a1420', card: '#2b1e33', accent: '#c9a227', text: '#ece0d0', muted: '#9a8a7a' },
                content: '<p>Historical murder mystery, duet with Bronze Blood.</p>' },
                { id: 'sugarspun', title: 'Sugarspun Tide Legacy', type: 'legacy',
                palette: { bg: '#85a2d4', card: '#ffdccb', accent: '#afebf3', text: '#fdf0f9', muted: '#8ed5f3' },
                content: '<p>Gen 0: The Tidewitch, Melusine Brinesweet..</p>' }
            ];
        }

        let pages = JSON.parse(localStorage.getItem('quietPages')) || seedPages();
        let openPageId = null;

        function savePages() {
            localStorage.setItem('quietPages', JSON.stringify(pages));
        }

        function renderCards() {
            const wrap = document.getElementById('page-cards');
            if (pages.length === 0) {
                wrap.innerHTML = '<p class="empty">No pages yet — create your first one above.</p>';
                return;
            }
            wrap.innerHTML = pages.map(function(p) {
                return `<div class="page-card" data-id="${p.id}" style="--card: ${p.palette.card}; --accent: ${p.palette.accent}">
                    <p class="type-label">${typeLabels[p.type]}</p>
                    <h3>${p.title}</h3>
                </div>`;
            }).join('');
        }

        function applyPalette(pal) {
            const root = document.documentElement;
            root.style.setProperty('--bg', pal.bg);
            root.style.setProperty('--card', pal.card);
            root.style.setProperty('--accent', pal.accent);
            root.style.setProperty('--text', pal.text);
            root.style.setProperty('--muted', pal.muted);
        }

        function openPage(id) {
            const page = pages.find(p => p.id === id);
            if (!page) return;
            openPageId = id;
            applyPalette(page.palette);
            document.getElementById('page-title').textContent = page.title;
            document.getElementById('page-type').textContent = typeLabels[page.type];
            document.getElementById('writing-area').innerHTML = page.content;
            document.getElementById('home-view').hidden = true;
            document.getElementById('page-view').hidden = false;
            renderCustomInputs();

        }

        function goHome() {
            openPageId = null;
            applyPalette(defaultPalette);
            document.getElementById('home-view').hidden = false;
            document.getElementById('page-view').hidden = true;
            renderCards();
        }

        document.getElementById('page-cards').addEventListener('click', function(event) {
            const card = event.target.closest('.page-card');
            if (card) openPage(card.dataset.id);
        });
        document.getElementById('back-home').addEventListener('click', goHome);

        document.getElementById('new-page').addEventListener('click', function() {
            const title = prompt('Page title:');
            if (!title) return;
            const type = prompt('Type: fiber, book, or legacy?').toLowerCase().trim();
            if (!['fiber', 'book', 'legacy'].includes(type)) {
                alert('Please type fiber, book, or legacy.');
                return;
            }
            pages.push({
                id: Date.now().toString(),
                title: title,
                type: type,
                palette: Object.assign({}, defaultPalette),
                content: ''
            });
            savePages();
            renderCards();
        });

        document.getElementById('writing-area').addEventListener('input', function(event) {
            const page = pages.find(p => p.id === openPageId);
            if (!page) return;
            page.content = event.target.innerHTML;
            savePages();
        });

        renderCards();

        const presetPalettes = [
            {name: 'Midnight Botanical', bg: '#1a1a2e', card: '#2d1b2e', accent: '#c9a227', text: '#e8e0d0', muted: '#a89a7a'},
            {name: 'Forest Whispers', bg: '#2c3e50', card: '#34495e', accent: '#2ecc71', text: '#ecf0f1', muted: '#95a5a6'},
            {name: 'Sunset Serenade', bg: '#ff7f50', card: '#ff6347', accent: '#ffd700', text: '#ffffff', muted: '#ff4500'},
            {name: 'Ocean Breeze', bg: '#0077b6', card: '#005f8a', accent: '#00b4d8', text: '#ffffff', muted: '#90e0ef'},
            {name: 'Ghost Flame', bg: '#0f1b2d', card: '#1c2f4a', accent: '#7fd4c1', text: '#e8f0e8', muted: '#7a9a94'},
            {name: 'Desert Dusk', bg: '#d35400', card: '#e67e22', accent: '#f1c40f', text: '#ffffff', muted: '#c0392b'},
            {name: 'Twilight Reverie', bg: '#2c003e', card: '#4b0082', accent: '#ff69b4', text: '#ffffff', muted: '#9370db'},
            {name: 'Arctic Aurora', bg: '#004e64', card: '#003545', accent: '#00ffcc', text: '#ffffff', muted: '#7f8c8d'},
            {name: 'Midnight Bloom', bg: '#1a0a2e', card: '#2d1b4e', accent: '#ff66ff', text: '#ffffff', muted: '#9966cc'},
            {name: 'Emerald Dreams', bg: '#013220', card: '#004d40', accent: '#00ff7f', text: '#ffffff', muted: '#26a69a'},
            {name: 'Golden Hour', bg: '#f39c12', card: '#e67e22', accent: '#f1c40f', text: '#ffffff', muted: '#d35400'},
            {name: 'Velvet Night', bg: '#2c003e', card: '#4b0082', accent: '#ff69b4', text: '#ffffff', muted: '#9370db'},
            {name: 'Crimson Twilight', bg: '#8b0000', card: '#a52a2a', accent: '#ff4500', text: '#ffffff', muted: '#cd5c5c'},
            {name: 'Silver Moonlight', bg: '#c0c0c0', card: '#a9a9a9', accent: '#ffd700', text: '#000000', muted: '#808080'},
            {name: 'Noir Plum', bg: '#1a1420', card: '#2b1e33', accent:'#c9a227', text: '#ece0d0', muted: '#9a8a7a'},
            {name: 'Obsidian Shadow', bg: '#0a0a0a', card: '#1c1c1c', accent: '#ff6600', text: '#ffffff', muted: '#808080'},
            {name: 'Shadowed Rose', bg: '#2c003e', card: '#4b0082', accent: '#ff69b4', text: '#ffffff', muted: '#9370db'},
            {name: 'Midnight Orchid', bg: '#1a0a2e', card: '#2d1b4e', accent: '#ff66ff', text: '#ffffff', muted: '#9966cc'},
            {name: 'Spring Meadow', bg: '#1c2a1e', card: '#2a3d2c', accent: '#e79fb1', text: '#f0ead8', muted: '#9aa88f'},
            {name: 'Autumn Leaves', bg: '#8b4513', card: '#a0522d', accent: '#f0e68c', text: '#ffffff', muted: '#cd853f'},
            {name: 'Terracotta Dusk', bg: '#241812', card: '#3a241a', accent: '#d97b4f', text: '#f0e2d0', muted: '#a88a6a'},
            {name: 'Ocean Morning', bg: '#10222e', card: '#1a3547', accent: '#5fb4d9', text: '#e4f0f5', muted: '#7a9aab'}
        ];

        function renderPresets() {
            const wrap = document.getElementById('preset-palettes');
            wrap.innerHTML = presetPalettes.map(function(preset, i) {
                return `<button class='preset' data-i="${i}" title="${preset.name}"
                    style="background: linear-gradient(135deg, ${preset.bg} 0 40%, ${preset.card} 40% 70%, ${preset.accent} 70%);"></button>`;
            }).join('');
        }

        document.getElementById('preset-palettes').addEventListener('click', function(event) {
            const btn = event.target.closest('.preset');
            if (!btn) return;
            const page = pages.find(p => p.id === openPageId);
            if (!page) return;
            page.palette = Object.assign({}, presetPalettes[Number(btn.dataset.i)]);
            applyPalette(page.palette);
            savePages();
            renderCustomInputs();
        });

        renderPresets();

        const colorRoles = [
            { key: 'bg', label: 'Background' },
            { key: 'card', label: 'Cards' },
            { key: 'accent', label: 'Accent' },
            { key: 'text', label: 'Text' },
            { key: 'muted', label: 'Muted' }
        ];

        function renderCustomInputs() {
            const page = pages.find(p => p.id === openPageId);
            const wrap = document.getElementById('custom-colors');
            wrap.innerHTML = colorRoles.map(function(role) {
                const value = page ? page.palette[role.key] : defaultPalette[role.key];
                return `<label class="color-row">${role.label}
                    <input type="color" data-key="${role.key}" value="${value}">
                </label>`;
            }).join('');
        }

        document.getElementById('custom-colors').addEventListener('input', function(event) {
            const input = event.target.closest('input[type="color"]');
            if (!input) return;
            const page = pages.find(p => p.id === openPageId);
            if (!page) return;
            page.palette[input.dataset.key] = input.value;
            applyPalette(page.palette);
            savePages();
        });
        
        document.getElementById('editor-toolbar').addEventListener('mousedown', function(event) {
            const btn = event.target.closest('button[data-cmd]');
            if (!btn) return;
            event.preventDefault();
            document.execCommand(btn.dataset.cmd, false, btn.dataset.value || null);
            const page = pages.find(p => p.id === openPageId);
            if (page) {
                page.content = document.getElementById('writing-area').innerHTML;
               savePages();
            }
        });
        </script>
    </body>
</html>
